<!doctype html><html><body style="margin:0;background:#888">
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
const PPU = 48; // pixels por unidade do modelo
const loader = new GLTFLoader();
const cache = {};
async function load(kit, name) {
  const k = kit + '/' + name;
  if (!cache[k]) cache[k] = await loader.loadAsync(`./${kit}/${name}.glb`);
  return cache[k].scene;
}
const texCache = {};
async function tex(v) {
  if (!texCache[v]) { const t = await new THREE.TextureLoader().loadAsync(`./ctex/variation-${v}.png`); t.flipY = false; t.colorSpace = THREE.SRGBColorSpace; t.magFilter = THREE.NearestFilter; texCache[v] = t; }
  return texCache[v];
}
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

// Monta uma cena a partir de uma lista de peças: {k:'castle'|'town', n:nome, x,z,y,r(graus),s(escala),v(variação de cor)}
window.renderSprite = async (parts, opt = {}) => {
  const scene = new THREE.Scene();
  const g = new THREE.Group(); scene.add(g);
  // expande pilhas: {st:[nomes], x,z,r,v} empilha as peças usando a altura de cada uma
  const flat = [];
  for (const p of parts) {
    if (!p.st) { flat.push(p); continue; }
    let y = p.y || 0;
    for (const n of p.st) {
      const src = await load(p.k || 'castle', n);
      flat.push({ ...p, st: undefined, n, y });
      y += new THREE.Box3().setFromObject(src).max.y * (p.s || 1);
    }
  }
  for (const p of flat) {
    const src = await load(p.k || 'castle', p.n);
    const o = src.clone(true);
    o.position.set(p.x || 0, p.y || 0, p.z || 0);
    o.rotation.y = (p.r || 0) * Math.PI / 180;
    if (p.s) o.scale.setScalar(p.s);
    const vt = p.v ? await tex(p.v) : null;
    o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; if (vt) { m.material = m.material.clone(); m.material.map = vt; } } });
    g.add(o);
  }
  scene.add(new THREE.HemisphereLight(0xfff4e0, 0x5a6b3a, 1.6));
  const sun = new THREE.DirectionalLight(0xffffff, 2.4);
  sun.position.set(-6, 12, 5); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 0.1, far: 50 });
  sun.shadow.bias = -0.0005; sun.shadow.radius = 3;
  scene.add(sun);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.28 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

  // câmera isométrica 2:1 (elevação 30°, azimute 45°)
  const e = 30 * Math.PI / 180, az = 45 * Math.PI / 180;
  const dir = new THREE.Vector3(Math.cos(e) * Math.sin(az), Math.sin(e), Math.cos(e) * Math.cos(az));
  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, -100, 100);
  cam.position.copy(dir.clone().multiplyScalar(20)); cam.lookAt(0, 0, 0); cam.updateMatrixWorld();
  const box = new THREE.Box3().setFromObject(g);
  const pad = opt.pad ?? 0.6;
  box.min.x -= pad; box.min.z -= pad; box.max.x += pad; box.max.z += pad; box.min.y = 0;
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  const inv = cam.matrixWorldInverse;
  for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) {
    const v = new THREE.Vector3(x, y, z).applyMatrix4(inv);
    minX = Math.min(minX, v.x); maxX = Math.max(maxX, v.x); minY = Math.min(minY, v.y); maxY = Math.max(maxY, v.y);
  }
  Object.assign(cam, { left: minX, right: maxX, top: maxY, bottom: minY }); cam.updateProjectionMatrix();
  const w = Math.ceil((maxX - minX) * PPU), h = Math.ceil((maxY - minY) * PPU);
  renderer.setSize(w, h, false);
  renderer.render(scene, cam);
  const o = new THREE.Vector3(0, 0, 0).applyMatrix4(inv);
  return { url: renderer.domElement.toDataURL('image/png'), w, h, ax: Math.round((o.x - minX) * PPU), ay: Math.round((maxY - o.y) * PPU) };
};
// junta imagens num atlas (prateleiras, largura máx. 2048)
window.makeAtlas = async (items) => {
  const imgs = await Promise.all(items.map(it => new Promise(r => { const i = new Image(); i.onload = () => r([it, i]); i.src = it.url; })));
  imgs.sort((a, b) => b[1].height - a[1].height);
  const W = 2048, meta = {}; let x = 0, y = 0, rowH = 0;
  for (const [it, im] of imgs) {
    if (x + im.width > W) { x = 0; y += rowH + 2; rowH = 0; }
    meta[it.name] = { x, y, w: im.width, h: im.height, ax: it.ax, ay: it.ay };
    x += im.width + 2; rowH = Math.max(rowH, im.height);
  }
  const c = document.createElement('canvas'); c.width = W; c.height = y + rowH;
  const g = c.getContext('2d');
  for (const [it, im] of imgs) g.drawImage(im, meta[it.name].x, meta[it.name].y);
  return { url: c.toDataURL('image/png'), meta };
};

// ---- personagens animados: renderiza quadros de uma animação numa caixa fixa ----
const gltfCache = {};
async function gltf(kit, name) { const k = kit + '/' + name; if (!gltfCache[k]) gltfCache[k] = await loader.loadAsync(`./${kit}/${name}.glb`); return gltfCache[k]; }
window.renderChar = async (c) => {
  const base = await gltf(c.kit, c.model);
  const o = SkeletonUtils.clone(base.scene);
  o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.frustumCulled = false; } });
  // armas presas aos ossos
  for (const w of c.armas || []) {
    const wm = (await gltf(w.kit, w.n)).scene.clone(true);
    wm.traverse(m => { if (m.isMesh) m.castShadow = true; });
    const bone = o.getObjectByName(w.osso);
    wm.position.set(...(w.pos || [0, 0, 0])); wm.rotation.set(...(w.rot || [0, 0, 0]).map(d => d * Math.PI / 180));
    wm.scale.setScalar(w.s || 1);
    (bone || o).add(wm);
  }
  const scene = new THREE.Scene();
  const holder = new THREE.Group(); holder.add(o); holder.rotation.y = (c.face || 0) * Math.PI / 180; holder.scale.setScalar(c.escala || 1); scene.add(holder);
  scene.add(new THREE.HemisphereLight(0xfff4e0, 0x5a4a6a, 1.7));
  const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(-4, 10, 6); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4 }); scene.add(sun);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ opacity: 0.3 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  const e = (c.elev || 35) * Math.PI / 180, az = 45 * Math.PI / 180;
  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, -50, 50);
  cam.position.set(Math.cos(e) * Math.sin(az) * 10, Math.sin(e) * 10, Math.cos(e) * Math.cos(az) * 10); cam.lookAt(0, (c.alvoY || 0.5) * (c.escala || 1), 0); cam.updateMatrixWorld();
  const B = c.caixa || 0.9, Hh = c.altura || 1.6, sc = c.escala || 1;
  // caixa fixa em volta do personagem (mesma para todos os quadros)
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (const x of [-B, B]) for (const y of [0, Hh]) for (const z of [-B, B]) { const v = new THREE.Vector3(x * sc, y * sc, z * sc).applyMatrix4(cam.matrixWorldInverse); minX = Math.min(minX, v.x); maxX = Math.max(maxX, v.x); minY = Math.min(minY, v.y); maxY = Math.max(maxY, v.y); }
  Object.assign(cam, { left: minX, right: maxX, top: maxY, bottom: minY }); cam.updateProjectionMatrix();
  const ppu = c.ppu || 48, w = Math.ceil((maxX - minX) * ppu), h = Math.ceil((maxY - minY) * ppu);
  renderer.setSize(w, h, false);
  const mixer = new THREE.AnimationMixer(o);
  const clip = base.animations.find(a => a.name === c.anim);
  const act = mixer.clipAction(clip); act.play(); if (c.umaVez) { act.setLoop(THREE.LoopOnce); act.clampWhenFinished = true; }
  const frames = [], n = c.quadros || 1, dur = clip.duration * (c.ate || 1);
  for (let i = 0; i < n; i++) {
    mixer.setTime(n === 1 ? 0 : dur * i / (c.umaVez ? n - 1 : n));
    renderer.render(scene, cam);
    frames.push(renderer.domElement.toDataURL('image/png'));
  }
  const oo = new THREE.Vector3(0, 0, 0).applyMatrix4(cam.matrixWorldInverse);
  return { frames, w, h, ax: Math.round((oo.x - minX) * ppu), ay: Math.round((maxY - oo.y) * ppu) };
};
window.ready = true;
</script></body></html>
