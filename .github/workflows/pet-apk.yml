# Monta o APK do CYRON Pet (pasta pet/) e coloca na release fixa "pet".
# Link que não muda, para baixar sempre o mais novo:
#   https://github.com/TiagoFernando113/coroa-de-ferro/releases/download/pet/CyronPet.apk
# A release "pet" nunca vira a "latest" do repositório: o link do APK da Coroa
# (releases/latest/download/CoroaDeFerro.apk) continua apontando para a Coroa.
name: APK do pet

on:
  push:
    paths:
      - "pet/**"
      - ".github/workflows/pet-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Montar APK
        run: gradle -p pet assembleRelease -PversionCode=${{ github.run_number }} --no-daemon

      - name: Publicar na release "pet"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp pet/app/build/outputs/apk/release/app-release.apk CyronPet.apk
          gh release view pet >/dev/null 2>&1 || gh release create pet \
            --target "${{ github.sha }}" \
            --title "CYRON Pet" \
            --notes "A CYRON passeando por cima dos seus apps. Instale por cima da versão anterior: o pet não se perde." \
            --latest=false
          gh release upload pet CyronPet.apk --clobber
